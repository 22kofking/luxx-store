let revealObs = null;
function setupReveal(root) {
  const els = U.$$('.lx-reveal', root);
  if (!document.body.classList.contains('lx-anim') || !('IntersectionObserver' in window) || !UI.first) {
    els.forEach((e) => e.classList.add('in'));
    return;
  }
  if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(
    (ents) =>
      ents.forEach((en) => {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          revealObs.unobserve(en.target);
        }
      }),
    { rootMargin: '0px 0px -8% 0px', threshold: 0.08 }
  );
  els.forEach((e) => revealObs.observe(e));
}

let cdTimer = null;
function setupCountdown() {
  clearInterval(cdTimer);
  const el = document.getElementById('lx-countdown');
  if (!el) return;
  const end = Date.parse(el.dataset.ends || '');
  if (!end) return;
  const tick = () => {
    const ms = end - Date.now();
    if (ms <= 0) {
      el.hidden = true;
      clearInterval(cdTimer);
      return;
    }
    const d = Math.floor(ms / 864e5);
    const h = Math.floor(ms / 36e5) % 24;
    const m = Math.floor(ms / 6e4) % 60;
    const s = Math.floor(ms / 1e3) % 60;
    const p2 = (n) => String(n).padStart(2, '0');
    el.innerHTML = [
      [d, 'dias'],
      [p2(h), 'horas'],
      [p2(m), 'min'],
      [p2(s), 'seg'],
    ]
      .map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`)
      .join('');
    el.hidden = false;
  };
  tick();
  cdTimer = setInterval(tick, 1000);
}

R.mount = () => {
  const root = document.getElementById('luxx-root');
  const y = window.scrollY;
  root.innerHTML = R.page(C());
  setupReveal(root);
  setupCountdown();
  SHOP.updateCount();
  if (UI.editing) ADMIN.enableInline();
  if (!UI.first) window.scrollTo(0, y);
  UI.first = false;
};

R.refreshCatalog = () => {
  const el = document.getElementById('lx-catalog');
  if (el) el.innerHTML = R.catalogInner(C());
};

/* ---- 07-shop.js ---- */
/* ==========================================================================
   LUXX STORE — compra: detalhes do produto, sacola, cupom, WhatsApp, avisos
   ========================================================================== */
const SHOP = (() => {
  const KEY = 'luxx_cart_v1';
  let cart = U.store.get(KEY, null) || { items: [], coupon: '' };
  if (!Array.isArray(cart.items)) cart = { items: [], coupon: '' };
  const save = () => U.store.set(KEY, cart);
  const product = (id) => C().products.find((p) => p.id === id);
  const sizesOf = (p) =>
    String(p.sizes || '')
      .split(',')
      .map((s) => s.trim())
      .filter(Boolean);

  /* ---------- avisos (toast) ---------- */
  let toastEl;
  let toastT;
  function toast(msg, ic = 'check') {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'lx-toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastEl);
    }
    toastEl.innerHTML = icon(ic) + '<span>' + U.esc(msg) + '</span>';
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------- mensagens de WhatsApp ---------- */
  const couponLine = () => {
    const st = C().store;
    return st.coupon && st.couponPct > 0 ? `\n\nQuero usar o cupom ${st.coupon} (${st.couponPct}% OFF) ⚡` : '';
  };
  function waProductMsg(p, size) {
    const c = C();
    if (p.soldout) return `Olá, ${c.brand.name}! Quero ser avisado quando *${p.name}* voltar ao estoque. ⚡`;
    return `Olá, ${c.brand.name}! ⚡ Quero comprar:\n\n• *${p.name}*${size ? ` — Tam. ${size}` : ''} — ${U.money(p.price)}${couponLine()}`;
  }

  /* ---------- sacola ---------- */
  const lines = () => cart.items.map((it, i) => ({ ...it, i, p: product(it.pid) })).filter((l) => l.p && !l.p.hidden);
  const count = () => lines().reduce((n, l) => n + l.qty, 0);
  const couponOk = () => {
    const st = C().store;
    return !!cart.coupon && !!st.coupon && st.couponPct > 0 && cart.coupon.trim().toUpperCase() === String(st.coupon).trim().toUpperCase();
  };
  function totals() {
    const sub = lines().reduce((s, l) => s + l.p.price * l.qty, 0);
    const disc = couponOk() ? sub * (C().store.couponPct / 100) : 0;
    return { sub, disc, total: sub - disc };
  }
  function updateCount() {
    const n = count();
    U.$$('.lx-bag-count').forEach((el) => {
      el.textContent = n;
      el.classList.toggle('has', n > 0);
    });
  }
  function add(pid, size, qty = 1) {
    const p = product(pid);
    if (!p) return;
    const ex = cart.items.find((i) => i.pid === pid && i.size === size);
    if (ex) ex.qty += qty;
    else cart.items.push({ pid, size, qty });
    save();
    updateCount();
    const b = U.$('.lx-bag-btn');
    if (b) {
      b.classList.remove('bump');
      void b.offsetWidth;
      b.classList.add('bump');
    }
    toast(`${p.name} na sacola!`, 'bag');
  }
  function cartMsg() {
    const c = C();
    const t = totals();
    const st = c.store;
    let m = `Olá, ${c.brand.name}! ⚡ Quero finalizar meu pedido pelo site:\n\n`;
    m += lines()
      .map((l) => `${l.qty}x *${l.p.name}*${l.size ? ` — Tam. ${l.size}` : ''} — ${U.money(l.p.price * l.qty)}`)
      .join('\n');
    m += `\n\nSubtotal: ${U.money(t.sub)}`;
    if (t.disc) m += `\nCupom ${st.coupon} (-${st.couponPct}%): -${U.money(t.disc)}`;
    m += `\n*Total: ${U.money(t.total)}*`;
    if (st.freeShipping > 0) m += t.total >= st.freeShipping ? '\nFrete: GRÁTIS 🎉' : '\nFrete: a calcular';
    m += '\n\nNome:\nCEP:\nPagamento (Pix ou cartão):';
    return m;
  }

  /* ---------- camadas (overlay, modal, gaveta) ---------- */
  let overlay;
  let modal;
  let drawer;
  let lastFocus = null;
  let qvPushed = false;
  const isOpen = (el) => el && el.classList.contains('open');

  function ensureOverlay() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.className = 'lx-overlay';
    overlay.hidden = true;
    overlay.addEventListener('click', () => {
      if (isOpen(modal)) closeModal();
      if (isOpen(drawer)) closeCart();
    });
    document.body.appendChild(overlay);
    return overlay;
  }
  function showOverlay(on) {
    ensureOverlay();
    if (on) {
      overlay.hidden = false;
      requestAnimationFrame(() => overlay.classList.add('open'));
      document.documentElement.style.overflow = 'hidden';
    } else if (!isOpen(modal) && !isOpen(drawer)) {
      overlay.classList.remove('open');
      document.documentElement.style.overflow = '';
      setTimeout(() => {
        if (!overlay.classList.contains('open')) overlay.hidden = true;
      }, 300);
    }
  }

  function openModal(html, label) {
    lastFocus = document.activeElement;
    if (!modal) {
      modal = document.createElement('div');
      modal.className = 'lx-modal';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      document.body.appendChild(modal);
    }
    modal.setAttribute('aria-label', label || 'Detalhes');
    modal.innerHTML = `<button class="lx-x" type="button" data-act="close-modal" aria-label="Fechar">${icon('close')}</button>${html}`;
    modal.scrollTop = 0;
    showOverlay(true);
    requestAnimationFrame(() => {
      modal.classList.add('open');
      const x = modal.querySelector('.lx-x');
      if (x) x.focus({ preventScroll: true });
    });
  }
  function closeModal(fromPop) {
    if (!isOpen(modal)) return;
    if (!fromPop && qvPushed) {
      qvPushed = false;
      try {
        history.back();
        return;
      } catch (e) {}
    }
    qvPushed = false;
    if (!fromPop && /^#produto-/.test(location.hash)) {
      try {
        history.replaceState(null, '', location.pathname + location.search);
      } catch (e) {}
    }
    modal.classList.remove('open');
    showOverlay(false);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  /* ---------- detalhes do produto ---------- */
  function quickView(pid) {
    const p = product(pid);
    if (!p) return false;
    const c = C();
    const cat = catOf(p.cat);
    const sizes = sizesOf(p);
    const pre = sizes.length === 1 ? sizes[0] : '';
    const st = c.store;
    openModal(
      `<div class="lx-qv" data-pid="${U.esc(p.id)}" data-size="${U.esc(pre)}">
        <div class="lx-qv-media">${R.badges(p)}${productMedia(p, 'art')}</div>
        <div class="lx-qv-info">
          ${cat ? `<span class="lx-card-cat">${U.esc(cat.name)}</span>` : ''}
          <h2 class="lx-h lx-qv-name">${U.esc(p.name)}</h2>
          <div>${R.price(p, true)}</div>
          ${p.desc ? `<p class="lx-qv-desc">${U.esc(p.desc)}</p>` : ''}
          ${
            sizes.length && !p.soldout
              ? `<div><div class="lx-qv-label">Tamanho <span id="lx-size-label">${U.esc(pre)}</span></div>
                <div class="lx-sizes" role="group" aria-label="Escolha o tamanho">${sizes
                  .map((s) => `<button class="lx-size" type="button" data-act="size" data-size="${U.esc(s)}" aria-pressed="${s === pre}">${U.esc(s)}</button>`)
                  .join('')}</div></div>`
              : ''
          }
          <div class="lx-qv-actions">
            ${
              p.soldout
                ? `<a class="lx-btn lx-btn--wa" href="${U.esc(wa(waProductMsg(p)))}" target="_blank" rel="noopener">${icon('whatsapp')}Avise-me quando chegar</a>`
                : `${st.cart ? `<button class="lx-btn" type="button" data-act="add" data-pid="${U.esc(p.id)}">${icon('bag')}Adicionar à sacola</button>` : ''}
                   <button class="lx-btn lx-btn--wa" type="button" data-act="buy-wa" data-pid="${U.esc(p.id)}">${icon('whatsapp')}Comprar pelo WhatsApp</button>
                   ${p.link ? `<a class="lx-btn lx-btn--ghost" href="${U.esc(safeUrl(p.link))}" target="_blank" rel="noopener">Comprar no site${icon('arrow')}</a>` : ''}`
            }
          </div>
          <div class="lx-trust">
            ${st.freeShipping > 0 ? `<span>${icon('truck')}Frete grátis acima de ${U.esc(moneyShort(st.freeShipping))}</span>` : ''}
            <span>${icon('refresh')}Troca fácil</span><span>${icon('shield')}Compra segura</span>
          </div>
        </div>
      </div>`,
      p.name
    );
    return true;
  }
  function view(pid) {
    if (!product(pid)) return;
    try {
      if (location.hash !== '#produto-' + pid) {
        history.pushState({ lxqv: pid }, '', '#produto-' + pid);
        qvPushed = true;
      }
    } catch (e) {}
    quickView(pid);
  }
  function fromHash() {
    const m = /^#produto-(.+)$/.exec(location.hash);
    if (m && product(decodeURIComponent(m[1]))) {
      quickView(decodeURIComponent(m[1]));
      return true;
    }
    return false;
  }
  window.addEventListener('popstate', () => {
    if (!fromHash() && isOpen(modal)) closeModal(true);
  });

  function selectedSize(btn) {
    const qv = btn.closest('.lx-qv');
    const p = product(qv.dataset.pid);
    const size = qv.dataset.size;
    if (sizesOf(p).length && !size) {
      const box = qv.querySelector('.lx-sizes');
      if (box) {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
      }
      toast('Escolha o tamanho primeiro', 'tag');
      return null;
    }
    return { p, size };
  }

  /* lista simples (usada quando o catálogo está desligado) */
  function openList(catId) {
    const k = catOf(catId);
    const list = visibleProducts().filter((p) => p.cat === catId);
    openModal(
      `<div style="padding:26px 18px 30px"><h2 class="lx-h lx-qv-name" style="margin:4px 60px 18px 0">${U.esc(k ? k.name : 'Produtos')}</h2>
      <div class="lx-grid">${list.map((p) => R.card(p)).join('') || '<p class="lx-empty">Nenhuma peça por aqui ainda.</p>'}</div></div>`,
      k ? k.name : 'Produtos'
    );
  }

  /* ---------- gaveta da sacola ---------- */
  function cartHTML() {
    const ls = lines();
    const t = totals();
    const st = C().store;
    const n = count();
    const body = ls.length
      ? ls
          .map(
            (l) => `<div class="lx-line">
          <div class="lx-line-img">${productMedia(l.p, 'art')}</div>
          <div><b>${U.esc(l.p.name)}</b>${l.size ? `<small>Tamanho: ${U.esc(l.size)}</small>` : ''}
            <div class="lx-line-price">${U.money(l.p.price * l.qty)}</div>
            <div class="lx-qty"><button type="button" data-act="qty" data-i="${l.i}" data-d="-1" aria-label="Diminuir">${icon('minus')}</button><span>${l.qty}</span><button type="button" data-act="qty" data-i="${l.i}" data-d="1" aria-label="Aumentar">${icon('plus')}</button></div>
          </div>
          <button class="lx-line-del" type="button" data-act="del" data-i="${l.i}" aria-label="Remover ${U.esc(l.p.name)}">${icon('trash')}</button>
        </div>`
          )
          .join('')
      : `<div class="lx-cart-empty">${icon('bag')}<p>Sua sacola está vazia.<br>Bora montar esse visual?</p><a class="lx-btn lx-btn--sm" href="#novidades" data-act="close-cart">Ver novidades</a></div>`;
    let ship = '';
    if (ls.length && st.freeShipping > 0) {
      const left = st.freeShipping - t.total;
      const pct = Math.min(100, (t.total / st.freeShipping) * 100);
      ship = `<div class="lx-ship">${left > 0 ? `Faltam <b>${U.money(left)}</b> para o <b>frete grátis</b>` : '🎉 Você ganhou <b>frete grátis</b>!'}<div class="lx-ship-bar"><i style="width:${pct}%"></i></div></div>`;
    }
    const coupon = !ls.length
      ? ''
      : couponOk()
        ? `<div class="lx-coupon-ok"><span>${icon('bolt')} Cupom ${U.esc(st.coupon)} aplicado (-${st.couponPct}%)</span><button type="button" data-act="coupon-remove">remover</button></div>`
        : `<form class="lx-coupon-row" data-form="coupon"><label class="lx-sr" for="lx-coupon-in">Cupom de desconto</label><input class="lx-input" id="lx-coupon-in" name="coupon" placeholder="Cupom (ex: ${U.esc(st.coupon)})" autocomplete="off" value="${U.esc(cart.coupon || '')}"><button class="lx-btn lx-btn--sm" type="submit">Aplicar</button></form>`;
    const foot = ls.length
      ? `<div class="lx-drawer-foot">${ship}${coupon}
        <div class="lx-totals"><div><span>Subtotal</span><span>${U.money(t.sub)}</span></div>
        ${t.disc ? `<div class="lx-disc"><span>Cupom ${U.esc(st.coupon)}</span><span>-${U.money(t.disc)}</span></div>` : ''}
        <div class="lx-total"><span>Total</span><span>${U.money(t.total)}</span></div></div>
        <button class="lx-btn lx-btn--wa lx-btn--block" type="button" data-act="checkout">${icon('whatsapp')}Finalizar pelo WhatsApp</button>
        <small style="text-align:center;color:var(--muted);font-size:12px">Você será levado ao WhatsApp com o pedido prontinho.</small></div>`
      : '';
    return `<div class="lx-drawer-head"><h2 class="lx-h" id="lx-cart-title">Sacola${n ? ` (${n})` : ''}</h2><button class="lx-x" type="button" data-act="close-cart" aria-label="Fechar sacola">${icon('close')}</button></div>
      <div class="lx-drawer-body">${body}</div>${foot}`;
  }
  function renderCart() {
    if (drawer) drawer.innerHTML = cartHTML();
    updateCount();
  }
  function openCart() {
    lastFocus = document.activeElement;
    if (isOpen(modal)) closeModal();
    if (!drawer) {
      drawer = document.createElement('aside');
      drawer.className = 'lx-drawer';
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      drawer.setAttribute('aria-labelledby', 'lx-cart-title');
      document.body.appendChild(drawer);
    }
    renderCart();
    showOverlay(true);
    requestAnimationFrame(() => {
      drawer.classList.add('open');
      const x = drawer.querySelector('.lx-x');
      if (x) x.focus({ preventScroll: true });
    });
  }
  function closeCart() {
    if (!isOpen(drawer)) return;
    drawer.classList.remove('open');
    showOverlay(false);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  /* ---------- toque secreto para abrir o painel ---------- */
  let taps = [];
  function secretTap() {
    const now = Date.now();
    taps = taps.filter((t) => now - t < 3000);
    taps.push(now);
    if (taps.length >= 5) {
      taps = [];
      ADMIN.open();
    }
  }

  /* ---------- cliques (delegação) ---------- */
  function onClick(e) {
    if (UI.editing && e.target.closest('#luxx-root [data-edit]')) {
      e.preventDefault();
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el || el.closest('#lx-admin')) return;
    const act = el.dataset.act;
    switch (act) {
      case 'view':
        e.preventDefault();
        view(el.dataset.pid);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'size': {
        const qv = el.closest('.lx-qv');
        qv.dataset.size = el.dataset.size;
        U.$$('.lx-size', qv).forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
        const lab = qv.querySelector('#lx-size-label');
        if (lab) lab.textContent = el.dataset.size;
        break;
      }
      case 'add': {
        const s = selectedSize(el);
        if (!s) return;
        add(s.p.id, s.size);
        closeModal();
        break;
      }
      case 'buy-wa': {
        const s = selectedSize(el);
        if (!s) return;
        window.open(wa(waProductMsg(s.p, s.size)), '_blank', 'noopener');
        break;
      }
      case 'cart':
        openCart();
        break;
      case 'close-cart':
        closeCart();
        break;
      case 'qty': {
        const it = cart.items[+el.dataset.i];
        if (!it) return;
        it.qty = Math.max(0, it.qty + +el.dataset.d);
        if (!it.qty) cart.items.splice(+el.dataset.i, 1);
        save();
        renderCart();
        break;
      }
      case 'del':
        cart.items.splice(+el.dataset.i, 1);
        save();
        renderCart();
        break;
      case 'coupon-remove':
        cart.coupon = '';
        save();
        renderCart();
        break;
      case 'checkout':
        if (!lines().length) return;
        window.open(wa(cartMsg()), '_blank', 'noopener');
        break;
      case 'copy-coupon': {
        const code = C().store.coupon;
        U.copy(code).then((ok) => {
          cart.coupon = code;
          save();
          toast(ok ? `Cupom ${code} copiado! Já está na sua sacola ⚡` : `Seu cupom: ${code} (já aplicado na sacola)`, 'bolt');
        });
        break;
      }
      case 'menu': {
        const nav = document.getElementById('lx-mnav');
        if (!nav) return;
        nav.hidden = !nav.hidden;
        el.setAttribute('aria-expanded', String(!nav.hidden));
        el.innerHTML = icon(nav.hidden ? 'menu' : 'close');
        break;
      }
      case 'close-menu': {
        const nav = document.getElementById('lx-mnav');
        if (nav) nav.hidden = true;
        const bt = U.$('.lx-burger');
        if (bt) {
          bt.setAttribute('aria-expanded', 'false');
          bt.innerHTML = icon('menu');
        }
        break;
      }
      case 'filter':
        UI.filter = el.dataset.cat;
        if (C().sections.catalogo.on) R.refreshCatalog();
        else {
          e.preventDefault();
          openList(el.dataset.cat);
        }
        break;
      case 'filter-chip':
        UI.filter = el.dataset.cat;
        R.refreshCatalog();
        break;
      case 'rail': {
        const rail = el.closest('.lx-rail-wrap').querySelector('.lx-rail');
        rail.scrollBy({ left: rail.clientWidth * 0.9 * +el.dataset.dir, behavior: 'smooth' });
        break;
      }
      case 'secret':
        secretTap();
        break;
      default:
    }
  }

  function onSubmit(e) {
    const f = e.target.closest('[data-form="coupon"]');
    if (!f) return;
    e.preventDefault();
    const v = f.coupon.value.trim();
    cart.coupon = v;
    save();
    if (couponOk()) toast(`Cupom ${C().store.coupon} aplicado! ⚡`, 'bolt');
    else toast('Cupom inválido 😕', 'close');
    renderCart();
  }

  function init() {
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', (e) => {
      if (e.target.matches('[data-act="sort"]')) {
        UI.sort = e.target.value;
        R.refreshCatalog();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (isOpen(modal)) closeModal();
      else if (isOpen(drawer)) closeCart();
    });
    fromHash();
  }

  return { init, toast, waProductMsg, updateCount, renderCart, openCart, view, add, totals, cartMsg, closeModal, closeCart, get cart() { return cart; } };
})();

/* ---- 08-bubble.js ---- */
/* ==========================================================================
   LUXX STORE — bolinha de vídeo flutuante (arrastável)
   O visitante pode arrastar a bolinha para qualquer lugar da tela; a posição
   fica salva no aparelho dele. Tocar abre o vídeo grande com som.
   ========================================================================== */
const BUBBLE = (() => {
  const POS_KEY = 'luxx_bubble_pos_v1';
  const HINT_KEY = 'luxx_bubble_hint_v1';
  const CLOSED_KEY = 'luxx_bubble_closed';
  const M = 10; // margem da tela
  let el = null;
  let frame = null;
  let reopenBtn = null;
  let player = null;
  let src = '';
  let sig = '';
  let pos = null; // {fx, fy} frações da área livre
  let px = { x: 0, y: 0 };
  let drag = null;
  let hintShown = false;

  const b = () => C().bubble;
  const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
  const dims = () => {
    const s = U.clamp(+(isMobile() ? b().sizeMobile : b().size) || 100, 56, 260);
    return { w: s, h: b().shape === 'story' ? Math.round(s * 1.6) : s };
  };
  const enabled = () => {
    const c = b();
    if (!c.on || !c.video) return false;
    if (c.closable && U.session.get(CLOSED_KEY) === '1') return false;
    return isMobile() ? c.mobile !== false : c.desktop !== false;
  };
  const sourceUrl = () => {
    const v = b().video;
    if (ytId(v)) return v;
    return MEDIA.url(v);
  };

  /* animação de reserva (peças surgindo) se o aparelho não tocar o vídeo */
  const fallbackHTML = () =>
    `<div class="lx-bubble-fb">${visibleProducts()
      .slice(0, 5)
      .map((p) => `<span>${ART.svg(p.art)}</span>`)
      .join('')}</div>`;
  let failed = false;
  function watchFail(v, box) {
    const fail = () => {
      if (box === frame) failed = true;
      box.querySelectorAll('video').forEach((x) => x.remove());
      if (!box.querySelector('.lx-bubble-fb')) box.insertAdjacentHTML('afterbegin', fallbackHTML());
    };
    v.addEventListener('error', fail);
    // o vídeo padrão é MP4/H.264: se o navegador não toca esse formato, já mostra a reserva
    if (b().video === 'media:default-video' && v.canPlayType && !v.canPlayType('video/mp4; codecs="avc1.4D401F"')) fail();
  }

  function mediaHTML(url, big) {
    const y = ytId(url);
    if (y) {
      const q = `autoplay=1&mute=${big ? 0 : 1}&loop=1&playlist=${y}&controls=${big ? 1 : 0}&playsinline=1&rel=0&modestbranding=1`;
      return `<iframe src="https://www.youtube-nocookie.com/embed/${y}?${q}" title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen tabindex="-1"></iframe>`;
    }
    return `<video src="${U.esc(url)}" ${big ? '' : 'muted '}autoplay loop playsinline preload="auto" disablepictureinpicture></video>`;
  }

  /* ---------- posição ---------- */
  function area() {
    const d = dims();
    const vw = document.documentElement.clientWidth;
    const vh = window.innerHeight;
    return { d, minX: M, minY: M, maxX: Math.max(M, vw - d.w - M), maxY: Math.max(M, vh - d.h - M - 6) };
  }
  function defaultPos() {
    const p = b().pos || 'bl';
    const fx = p.endsWith('r') ? 1 : 0;
    const fy = p.startsWith('t') ? 0.14 : p.startsWith('m') ? 0.5 : 1;
    return { fx, fy };
  }
  function place(x, y) {
    px = { x, y };
    el.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
    const hint = el.querySelector('.lx-bubble-hint');
    if (hint) {
      const left = x < document.documentElement.clientWidth / 2;
      hint.classList.toggle('r', left);
      hint.classList.toggle('l', !left);
    }
  }
  function applyPos() {
    if (!el) return;
    const a = area();
    const p = pos || defaultPos();
    place(a.minX + p.fx * (a.maxX - a.minX), a.minY + p.fy * (a.maxY - a.minY));
  }
  function savePos() {
    const a = area();
    pos = {
      fx: a.maxX > a.minX ? (px.x - a.minX) / (a.maxX - a.minX) : 0,
      fy: a.maxY > a.minY ? (px.y - a.minY) / (a.maxY - a.minY) : 0,
    };
    U.store.set(POS_KEY, pos);
  }

  /* ---------- arrastar ---------- */
  function onDown(e) {
    if (e.button > 0 || e.target.closest('.lx-bubble-x')) return;
    // evita que o navegador comece a "arrastar" um link/imagem que esteja embaixo da bolinha
    e.preventDefault();
    if (document.activeElement !== el) el.focus({ preventScroll: true });
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: px.x, oy: px.y, moved: false };
    try {
      el.setPointerCapture(e.pointerId);
    } catch (err) {}
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 7 || !b().drag) return;
      drag.moved = true;
      el.classList.add('dragging');
      hideHint();
    }
    const a = area();
    place(U.clamp(drag.ox + dx, a.minX, a.maxX), U.clamp(drag.oy + dy, a.minY, a.maxY));
    e.preventDefault();
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const was = drag.moved;
    drag = null;
    el.classList.remove('dragging');
    if (was) savePos();
    else if (e.type === 'pointerup') tap();
  }
  function onKey(e) {
    const step = e.shiftKey ? 60 : 20;
    const k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (k && b().drag) {
      const a = area();
      place(U.clamp(px.x + k[0], a.minX, a.maxX), U.clamp(px.y + k[1], a.minY, a.maxY));
      savePos();
      e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      tap();
    }
  }

  function tap() {
    const c = b();
    if (c.tap === 'none') return;
    if (c.tap === 'whatsapp') window.open(wa(), '_blank', 'noopener');
    else if (c.tap === 'link') {
      const h = linkTo(c.ctaLink);
      if (isExternal(h)) window.open(h, '_blank', 'noopener');
      else location.hash = h.replace(/^#/, '');
    } else openPlayer();
  }

  function hideHint() {
    const h = el && el.querySelector('.lx-bubble-hint');
    if (h) h.classList.remove('show');
    U.store.set(HINT_KEY, 1);
  }

  /* ---------- montar / atualizar ---------- */
  function build() {
    el = document.createElement('div');
    el.className = 'lx-bubble';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.innerHTML = `<span class="lx-bubble-ring" aria-hidden="true"></span><div class="lx-bubble-frame"></div><span class="lx-bubble-label"></span>
      <button class="lx-bubble-x" type="button" aria-label="Fechar vídeo">${icon('close')}</button>
      <span class="lx-bubble-hint r" aria-hidden="true">${icon('move')}Arraste-me</span>`;
    frame = el.querySelector('.lx-bubble-frame');
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('keydown', onKey);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.querySelector('.lx-bubble-x').addEventListener('click', (e) => {
      e.stopPropagation();
      U.session.set(CLOSED_KEY, '1');
      update();
    });
    document.body.appendChild(el);
  }

  function showReopen(show) {
    if (show && !reopenBtn) {
      reopenBtn = document.createElement('button');
      reopenBtn.className = 'lx-bubble-reopen';
      reopenBtn.type = 'button';
      reopenBtn.innerHTML = icon('play') + 'Vídeo';
      reopenBtn.addEventListener('click', () => {
        U.session.set(CLOSED_KEY, '0');
        update();
      });
      document.body.appendChild(reopenBtn);
    }
    if (reopenBtn) reopenBtn.hidden = !show;
  }

  function update() {
    const c = b();
    const closedByVisitor = c.on && c.closable && U.session.get(CLOSED_KEY) === '1';
    showReopen(closedByVisitor && !!c.video);
    if (!enabled()) {
      if (el) el.hidden = true;
      return;
    }
    if (!el) build();
    el.hidden = false;
    const d = dims();
    el.style.setProperty('--bs', d.w + 'px');
    el.style.setProperty('--bb', c.border || 'var(--accent)');
    el.style.setProperty('--bbw', (+c.borderWidth || 0) + 'px');
    el.className = `lx-bubble shape-${c.shape || 'circle'}${c.pulse ? ' pulse' : ''}${c.drag ? '' : ' nodrag'}`;
    el.querySelector('.lx-bubble-ring').hidden = !c.ring;
    el.querySelector('.lx-bubble-x').hidden = !c.closable;
    const lab = el.querySelector('.lx-bubble-label');
    lab.textContent = ph(c.label || '');
    lab.hidden = !c.label;
    el.setAttribute('aria-label', `${ph(c.title || 'Vídeo da coleção')} — ${c.tap === 'expand' ? 'toque para assistir' : 'toque para abrir'}${c.drag ? '. Arraste para mudar de lugar' : ''}`);
    const url = sourceUrl();
    const nsig = url + '|' + c.shape;
    if (nsig !== sig) {
      sig = nsig;
      src = url;
      failed = false;
      frame.innerHTML = url ? mediaHTML(url, false) : '';
      const v = frame.querySelector('video');
      if (v) {
        watchFail(v, frame);
        v.muted = true;
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      }
    }
    applyPos();
    if (c.drag && !hintShown && !U.store.get(HINT_KEY)) {
      hintShown = true;
      const h = el.querySelector('.lx-bubble-hint');
      setTimeout(() => h && h.classList.add('show'), 1800);
      setTimeout(() => h && h.classList.remove('show'), 6500);
    }
  }

  /* ---------- player grande ---------- */
  function openPlayer() {
    const c = b();
    if (!src) return;
    if (!player) {
      player = document.createElement('div');
      player.className = 'lx-player';
      player.setAttribute('role', 'dialog');
      player.setAttribute('aria-modal', 'true');
      player.addEventListener('click', (e) => {
        const t = e.target.closest('[data-bact]');
        if (!t) return;
        const a = t.dataset.bact;
        if (a === 'close') closePlayer();
        if (a === 'cta') {
          closePlayer();
          if (!isExternal(t.getAttribute('href'))) return;
        }
        if (a === 'sound') {
          const v = player.querySelector('video');
          if (v) {
            v.muted = !v.muted;
            t.innerHTML = icon(v.muted ? 'mute' : 'sound');
          }
        }
      });
      document.body.appendChild(player);
    }
    const yt = !!ytId(src);
    const cta = linkTo(c.ctaLink);
    player.setAttribute('aria-label', ph(c.title || 'Vídeo'));
    player.innerHTML = `<div class="lx-player-bg" data-bact="close"></div>
      <div class="lx-player-card">
        <div class="lx-player-media">${mediaHTML(src, true)}
          <div class="lx-player-tools">${yt ? '' : `<button type="button" data-bact="sound" aria-label="Som">${icon('sound')}</button>`}<button type="button" data-bact="close" aria-label="Fechar">${icon('close')}</button></div>
        </div>
        ${
          c.title || c.text || c.cta || c.cta2
            ? `<div class="lx-player-info">
          ${c.title ? `<h3 class="lx-h">${U.esc(ph(c.title))}</h3>` : ''}
          ${c.text ? `<p>${U.esc(ph(c.text))}</p>` : ''}
          <div class="lx-player-btns">
            ${c.cta ? `<a class="lx-btn" href="${U.esc(cta)}"${tgt(cta)} data-bact="cta">${U.esc(ph(c.cta))}</a>` : ''}
            ${c.cta2 ? `<a class="lx-btn lx-btn--wa" href="${U.esc(wa())}" target="_blank" rel="noopener">${icon('whatsapp')}${U.esc(ph(c.cta2))}</a>` : ''}
          </div></div>`
            : ''
        }
      </div>`;
    const small = frame && frame.querySelector('video');
    const v = player.querySelector('video');
    const media = player.querySelector('.lx-player-media');
    if (failed && v) {
      v.remove();
      media.insertAdjacentHTML('afterbegin', fallbackHTML());
      const snd = media.querySelector('[data-bact="sound"]');
      if (snd) snd.remove();
    } else if (v) {
      watchFail(v, media);
      if (small) {
        try {
          v.currentTime = small.currentTime;
        } catch (e) {}
        small.pause();
      }
      v.muted = false;
      const p = v.play();
      if (p && p.catch)
        p.catch(() => {
          v.muted = true;
          v.play().catch(() => {});
          const s = player.querySelector('[data-bact="sound"]');
          if (s) s.innerHTML = icon('mute');
        });
    }
    requestAnimationFrame(() => player.classList.add('open'));
    const x = player.querySelector('[data-bact="close"].lx-x, .lx-player-tools [data-bact="close"]');
    if (x) x.focus({ preventScroll: true });
    document.addEventListener('keydown', escClose);
  }
  function escClose(e) {
    if (e.key === 'Escape') closePlayer();
  }
  function closePlayer() {
    if (!player) return;
    player.classList.remove('open');
    document.removeEventListener('keydown', escClose);
    const v = player.querySelector('video');
    if (v) v.pause();
    setTimeout(() => {
      if (!player.classList.contains('open')) player.innerHTML = '';
    }, 320);
    const small = frame && frame.querySelector('video');
    if (small) small.play().catch(() => {});
    if (el) el.focus({ preventScroll: true });
  }

  function init() {
    pos = U.store.get(POS_KEY, null);
    document.addEventListener(
      'dragstart',
      (e) => {
        if (drag) e.preventDefault();
      },
      true
    );
    update();
    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        update();
      }, 120);
    });
  }

  function resetPos() {
    pos = null;
    U.store.del(POS_KEY);
    applyPos();
  }

  return { init, update, resetPos, openPlayer };
})();

                      .map(([v, l]) => `<option value="${esc(v)}"${String(it[k]) === String(v) ? ' selected' : ''}>${esc(l)}</option>`)
                      .join('')}</select>`
                  : `<input type="text" data-p="${p}.${i}.${k}" value="${esc(it[k] == null ? '' : it[k])}" placeholder="${esc(label)}" aria-label="${esc(label)}" autocomplete="off">`
              )
              .join('')}<button type="button" class="lxa-icon lxa-icon--red" data-a="obj-del" data-p="${p}" data-i="${i}" aria-label="Remover">${icon('trash')}</button></div>`
        )
        .join('');
      return `${o.label ? `<div class="lxa-label">${o.label}</div>` : ''}${rows}<button type="button" class="lxa-btn lxa-btn--sm" data-a="obj-add" data-p="${p}" data-tpl="${esc(
        JSON.stringify(tpl)

  /* ====================================================================== */

  const V = {};

      <p class="lxa-sub">Aqui você muda <b>tudo</b> do site: cores, fontes, textos, produtos, fotos e o vídeo da bolinha. Tudo aparece na hora.</p>

        <button type="button" data-go="fontes">${icon('type')}Fontes<small>${esc(c.theme.fonts.title)} + ${esc(c.theme.fonts.body)}</small></button>

        'Cor principal (raio ⚡)',

  V.estilo = () =>
    `<h2 class="lxa-h">Estilo e layout</h2><p class="lxa-sub">Cantos, bordas, espaçamentos, colunas e efeitos.</p>
    ${card(
      'Cantos e bordas',
      F.range('theme.style.radius', 'Arredondamento dos cards', 0, 40, 1, 'px') +
        F.select('theme.style.btnRadius', 'Formato dos botões', [
          [0, 'Reto'],
          [6, 'Levemente arredondado'],
          [14, 'Arredondado'],
          [999, 'Pílula (redondo)'],

        F.select('theme.style.btnStyle', 'Estilo dos botões', [
          ['solid', 'Preenchido'],
          ['outline', 'Só contorno'],

        F.range('theme.style.border', 'Espessura das bordas', 0, 4, 1, 'px')
    )}
    ${card(

        `<div class="lxa-row">${F.select('theme.style.colsDesk', 'Colunas no computador', [
          [2, '2'],
          [3, '3'],
          [4, '4'],
          [5, '5'],

          [1, '1'],
          [2, '2'],
        ], { t: 'num' })}</div>`
    )}
    ${card(
      'Efeitos',
      F.toggle('theme.style.glow', 'Brilho neon', 'Luz amarela atrás de botões, banner e cards') +
        F.toggle('theme.style.grain', 'Textura granulada', 'Visual de filme/streetwear por cima do site') +
        F.toggle('theme.style.anim', 'Animações', 'Elementos surgindo ao rolar, faixas em movimento') +
        F.toggle('store.floatWhats', 'Botão flutuante do WhatsApp', 'Bolinha verde no canto da tela')
    )}`;

  /* ---------- seções ---------- */
  const sp = (id, k) => `sections.${id}.${k}`;
  function sectionFields(id) {
    const T = (k, l, o) => F.text(sp(id, k), l, o);
    const A = (k, l, o) => F.area(sp(id, k), l, o);
    const head = () => T('nav', 'Nome no menu', { hint: 'Deixe vazio para não aparecer no menu.' }) + T('kicker', 'Selo pequeno (acima do título)') + T('title', 'Título') + A('text', 'Texto');
    switch (id) {
      case 'hero':
        return (
          F.select(sp(id, 'layout'), 'Layout', [
            ['split', 'Texto + ilustração/foto ao lado'],
            ['full', 'Foto de fundo (tela cheia)'],
          ], { hint: '"Foto de fundo" precisa de uma foto enviada abaixo.', rr: 1 }) +
          T('kicker', 'Selo (acima do título)') +
          T('title', 'Título — linha 1') +
          T('titleAccent', 'Título — linha 2 (na cor de destaque)') +
          A('text', 'Texto') +
          T('btn1', 'Botão principal') +
          T('btn1Link', 'Link do botão principal', { hint: 'Use #novidades, #catalogo, #promo, whatsapp ou um link https://' }) +
          T('btn2', 'Botão do WhatsApp') +
          `<div class="lxa-row">${T('sticker1', 'Adesivo 1')}${T('sticker2', 'Adesivo 2')}</div>` +
          F.objlist(sp(id, 'stats'), [
            ['big', 'Destaque'],
            ['small', 'Legenda'],
          ], { big: 'Novo', small: 'Legenda' }, { label: 'Destaques embaixo dos botões' }) +
          '<div style="height:14px"></div>' +
          F.media(sp(id, 'img'), 'Foto do banner (opcional)', { hint: 'Sem foto, aparece a ilustração abaixo.' }) +
          (g(sp(id, 'img')) ? F.range(sp(id, 'overlay'), 'Escurecer a foto (tela cheia)', 0, 0.9, 0.05, '%') : `<div class="lxa-label" style="margin-top:12px">Ilustração do banner</div>${F.art(sp(id, 'art'))}`)
        );
      case 'marquee':
        return F.list(sp(id, 'words'), 'Palavras da faixa');
      case 'novidades':
        return (
          `<p class="lxa-note">Aparecem aqui os produtos marcados como <b>Novidade</b> no Catálogo.</p>` +
          head() +
          F.select(sp(id, 'layout'), 'Exibição', [
            ['carousel', 'Carrossel (deslizar para o lado)'],
            ['grid', 'Grade'],
          ]) +
          F.num(sp(id, 'limit'), 'Máximo de produtos', { min: 1, max: 40 })
        );
      case 'maisvendidos':
        return (
          `<p class="lxa-note">Aparecem aqui os produtos marcados como <b>Mais vendido</b>, na ordem do Catálogo.</p>` +
          head() +
          F.num(sp(id, 'limit'), 'Máximo de produtos', { min: 1, max: 40 }) +
          F.toggle(sp(id, 'rank'), 'Mostrar ranking (01, 02, 03…)')
        );
      case 'categorias':
        return `<p class="lxa-note">As categorias em si você edita na aba <b>Categorias</b>.</p>` + head();
      case 'catalogo':
        return head();
      case 'promo':
        return (
          `<p class="lxa-note">O código do cupom e a porcentagem ficam em <b>Marca e contato</b>. Nos textos, <b>{cupom}</b> e <b>{desconto}</b> viram o código e a % automaticamente.</p>` +
          head() +
          T('btn', 'Botão copiar cupom') +
          T('btn2', 'Link abaixo do cupom') +
          A('note', 'Observação (letra miúda)', { rows: 2 }) +
          `<label class="lxa-field"><span>Contagem regressiva até (opcional)</span><input type="datetime-local" data-p="${sp(id, 'endsAt')}" value="${esc(g(sp(id, 'endsAt')) || '')}">${hint(
            'Deixe vazio para não mostrar o relógio. Quando o tempo acaba, o relógio some sozinho.'

        );
      case 'manifesto':
        return T('kicker', 'Selo pequeno') + T('title', 'Título') + A('text', 'Texto', { rows: 6 }) + T('sign', 'Assinatura');
      case 'beneficios':
        return F.objlist(sp(id, 'items'), [
          ['icon', 'Ícone', 'select', [['truck', 'Caminhão'], ['refresh', 'Troca'], ['card', 'Cartão'], ['shield', 'Escudo'], ['bolt', 'Raio'], ['star', 'Estrela'], ['bag', 'Sacola'], ['clock', 'Relógio'], ['whatsapp', 'WhatsApp'], ['pin', 'Local']]],
          ['title', 'Título'],
          ['text', 'Texto'],
        ], { icon: 'bolt', title: 'Novo benefício', text: 'Descrição' }, { cls: 'three' });
      case 'whats':
        return (
          head() +
          T('btn', 'Botão do WhatsApp') +
          T('btn2', 'Botão secundário (catálogo)') +
          F.objlist(sp(id, 'chat'), [
            ['from', 'Quem fala', 'select', [['c', 'Cliente'], ['l', 'Loja']]],
            ['text', 'Mensagem'],
          ], { from: 'c', text: 'Nova mensagem' }, { cls: 'chat', label: 'Conversa de exemplo (desenho do celular)' })
        );
      default:
        return '';
    }
  }

      .map((id, i) => {
        const s = c.sections[id];
        if (!s) return '';
        const open = opened.secoes === id;
        return `<div class="lxa-item${open ? ' open' : ''}${s.on ? '' : ' off'}">
          <div class="lxa-item-head">
            <label class="lxa-switch" style="padding:0;border:0" aria-label="Mostrar ${esc(SECTION_LABEL[id])}"><input type="checkbox" data-p="sections.${id}.on" data-t="bool" data-rr="1"${s.on ? ' checked' : ''}><i></i></label>
            <button type="button" class="lxa-item-main" data-a="sec-open" data-id="${id}"><b>${esc(SECTION_LABEL[id] || id)}</b><small>${s.on ? 'Visível' : 'Escondida'} · toque para editar</small></button>
            <div class="lxa-item-tools">
              <button type="button" class="lxa-icon" data-a="sec-move" data-i="${i}" data-d="-1" aria-label="Subir"${i === 0 ? ' disabled' : ''}>${icon('up')}</button>
              <button type="button" class="lxa-icon" data-a="sec-move" data-i="${i}" data-d="1" aria-label="Descer"${i === c.order.length - 1 ? ' disabled' : ''}>${icon('down')}</button>

          ${open ? `<div class="lxa-item-body">${sectionFields(id)}</div>` : ''}

      ${card('Barra de anúncios (topo)', F.toggle('sections.topbar.on', 'Mostrar barra de anúncios', '', true) + F.list('sections.topbar.items', 'Mensagens (uma por linha)', { hint: 'Use {cupom}, {desconto}, {frete} e {parcelas} para preencher automático.' }))}
      ${items}
      ${card(
        'Rodapé',
        F.area('sections.footer.text', 'Texto sobre a loja') +
          F.list('sections.footer.help', 'Links de ajuda', { hint: 'Um por linha. Cada um abre o WhatsApp com a dúvida escrita.' }) +
          F.text('sections.footer.copyright', 'Direitos autorais', { hint: '{ano} e {loja} são preenchidos sozinhos.' }) +
          F.text('sections.footer.legal', 'Linha extra (CNPJ, endereço…)') +
          F.toggle('sections.footer.payments', 'Mostrar formas de pagamento')
      )}`;
  };

  /* ---------- catálogo ---------- */
  function productForm(p, i) {
    const P = (k) => `products.${i}.${k}`;
    const cats = [['', '— sem categoria —']].concat(cfg().categories.map((k) => [k.id, k.name]));
    return (
      F.text(P('name'), 'Nome do produto') +
      `<div class="lxa-row">${F.money(P('price'), 'Preço (R$)')}${F.money(P('old'), 'Preço antigo "de"', { ph: 'opcional', hint: 'Mostra riscado + % OFF' })}</div>` +

  const thumb = (o) => {
    const u = o.img && MEDIA.url(o.img);
    return u ? `<img src="${esc(u)}" alt="">` : ART.svg(o.art);
  };

  function productList() {
    const c = cfg();
    const q = search.trim().toLowerCase();
    const list = c.products
      .map((p, i) => ({ p, i }))
      .filter(({ p }) => !q || (p.name + ' ' + ((catOf(p.cat) || {}).name || '')).toLowerCase().includes(q));
    const items = list
      .map(({ p, i }) => {
        const open = opened.produtos === p.id;
        const tags = [p.isNew && '<em class="y">Novo</em>', p.best && '<em class="y">Top</em>', p.soldout && '<em class="r">Esgotado</em>', p.hidden && '<em>Oculto</em>', offPct(p) && `<em>-${offPct(p)}%</em>`]
          .filter(Boolean)
          .join('');
        return `<div class="lxa-item${open ? ' open' : ''}${p.hidden ? ' off' : ''}">
          <div class="lxa-item-head">
            <button type="button" class="lxa-thumb" data-a="prod-open" data-id="${esc(p.id)}" aria-label="Editar ${esc(p.name)}">${thumb(p)}</button>
            <button type="button" class="lxa-item-main" data-a="prod-open" data-id="${esc(p.id)}"><b data-live="products.${i}.name">${esc(p.name)}</b><small>${U.money(p.price)} · ${esc(
              (catOf(p.cat) || {}).name || 'Sem categoria'

  /* ====================================================================== */
  /* Montagem                                                                */
  /* ====================================================================== */
  function build() {
    root = document.createElement('div');
    root.id = 'lx-admin';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Painel da loja');
    root.hidden = true;
    root.innerHTML = `<div class="lxa-head">
        <div class="lxa-title">${icon('bolt')}PAINEL</div>
        <button type="button" class="lxa-hbtn" data-a="undo" aria-label="Desfazer" title="Desfazer">${icon('undo')}</button>
        <button type="button" class="lxa-hbtn" data-a="redo" aria-label="Refazer" title="Refazer">${icon('redo')}</button>
        <button type="button" class="lxa-hbtn lxa-hbtn--y" data-a="peek">${icon('eye')}Ver site</button>
        <button type="button" class="lxa-hbtn" data-a="close" aria-label="Fechar painel">${icon('close')}</button>
      </div>
      <nav class="lxa-tabs" role="tablist">${TABS.map(([k, l, ic]) => `<button type="button" class="lxa-tab" role="tab" data-tab="${k}" aria-selected="${k === tab}">${icon(ic)}${l}</button>`).join('')}</nav>
      <div class="lxa-body" id="lxa-body"></div>
      <div class="lxa-foot"><span class="lxa-status" id="lxa-status"></span><button type="button" class="lxa-btn lxa-btn--sm lxa-btn--y" data-a="export">${icon('download')}Baixar site</button></div>`;
    document.body.appendChild(root);
    body = root.querySelector('#lxa-body');
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('change', onChange);
    // re-render ao sair de alguns campos (ex.: link de foto) — mas nunca no meio da digitação:
    // se o foco foi para outro campo do painel, espera, senão o campo tocado seria recriado
    root.addEventListener('focusout', (e) => {
      if (e.target.dataset && e.target.dataset.rrBlur) pendingRender = true;
      if (!pendingRender) return;
      const next = e.relatedTarget;
      if (next && root.contains(next) && /^(INPUT|TEXTAREA|SELECT)$/.test(next.tagName)) return;
      pendingRender = false;
      render();
    });
  }

  function render() {
    if (!body) return;
    pendingRender = false;
    if (!V[tab]) tab = 'inicio';
    const st = body.scrollTop;
    body.innerHTML = V[tab]();
    body.scrollTop = st;
    U.$$('.lxa-tab', root).forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    U.$$('video', body).forEach((v) => {
      v.muted = true;
      v.play().catch(() => {});
    });
    if (tab === 'video') {
      const ref = cfg().bubble.video;
      if (MEDIA.kind(ref) === 'idb' || MEDIA.kind(ref) === 'embed')
        MEDIA.size(ref).then((n) => {
          const s = body.querySelector('[data-vsize]');
          if (s && n) s.textContent = ` · ${U.fileSize(n)}`;
        });
    }
    status();
  }

  function status() {
    if (!root) return;
    const u = root.querySelector('[data-a="undo"]');
    const r = root.querySelector('[data-a="redo"]');
    if (u) u.disabled = !STATE.canUndo;
    if (r) r.disabled = !STATE.canRedo;
    const s = root.querySelector('#lxa-status');
    if (s) {
      s.classList.toggle('warn', !STATE.saveOk);
      s.innerHTML = STATE.saveOk ? `${icon('check')}<span>Salvo neste aparelho</span>` : `${icon('close')}<span>Este navegador não salvou — baixe o site para não perder</span>`;
    }
  }

  function goTab(k) {
    tab = k;
    U.store.set(TAB_KEY, k);
    body.scrollTop = 0;
    render();
    const t = root.querySelector(`.lxa-tab[data-tab="${k}"]`);
    if (t) t.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  /* ---------- entradas ---------- */
  function onInput(e) {
    const el = e.target;
    if (el.dataset.search) {
      search = el.value;
      const list = body.querySelector('#lxa-plist');
      if (list) list.innerHTML = productList();
      return;
    }
    if (el.dataset.font) return; // tratado no change
    const p = el.dataset.p;
    if (!p || el.type === 'file') return;
    const t = el.dataset.t || 'text';
    let v;
    switch (t) {
      case 'num':
        if (el.value === '') return;
        v = parseFloat(String(el.value).replace(',', '.'));
        if (isNaN(v)) return;
        break;
      case 'money':
        v = U.num(el.value);
        break;
      case 'bool':
        v = el.checked;
        break;
      case 'list':
        v = el.value
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean);
        break;
      case 'color': {
        v = el.value;
        const hx = el.parentNode.querySelector('[data-t="hex"]');
        if (hx) hx.value = v;
        break;
      }
      case 'hex': {
        v = U.normHex(el.value);
        if (!v) return;
        const cp = el.parentNode.querySelector('[data-t="color"]');
        if (cp) cp.value = v;
        break;
      }
      default:
        v = el.value;
    }
    U.set(cfg(), p, v);
    if (p.startsWith('theme.colors.') || p.startsWith('theme.fonts.') || p.startsWith('theme.style.')) cfg().theme.preset = 'custom';
    const out = body.querySelector(`[data-out="${p}"]`);
    if (out) out.textContent = fmtOut(v, el.dataset.unit);
    U.$$(`[data-live="${p}"]`, body).forEach((n) => (n.textContent = v));
    const artP = p.replace(/\.(type|color|detail|print|sole|strapColor)$/, '');
    const prev = body.querySelector(`[data-artprev="${artP}"]`);
    if (prev) prev.innerHTML = ART.svg(U.get(cfg(), artP));
    if (p === 'store.coupon') cfg().store.coupon = String(v).trim().toUpperCase();
    const waTest = body.querySelector('[data-wa-test]');
    if (waTest) waTest.href = wa();
    STATE.touch();
    status();
  }

  function onChange(e) {
    const el = e.target;
    if (el.dataset.font) {
      const p = el.dataset.font;
      STATE.checkpoint();
      if (el.value === '__custom') customFont.add(p);
      else {
        customFont.delete(p);
        U.set(cfg(), p, el.value);
        cfg().theme.preset = 'custom';
        STATE.touch();
      }
      render();
      if (el.value === '__custom') {
        const inp = body.querySelector(`input[data-p="${p}"]`);
        if (inp) inp.focus();
      }
      return;
    }
    if (el.dataset.upload) {
      STATE.checkpoint();
      return upload(el);
    }
    if (el.dataset.import) return importFile(el);
    if (el.dataset.rr) render();
    if (el.dataset.p === 'store.coupon') el.value = cfg().store.coupon;
  }

  async function upload(input) {
    const p = input.dataset.upload;
    const f = input.files && input.files[0];
    if (!f) return;
    const video = /^video\//.test(f.type) || p === 'bubble.video';
    SHOP.toast(video ? 'Carregando vídeo…' : 'Carregando foto…', 'upload');
    try {
      if (video && f.size > 40 * 1048576 && !confirm(`Esse vídeo tem ${U.fileSize(f.size)}. Vídeos grandes deixam o site pesado — prefira até 15 segundos. Usar mesmo assim?`)) return;
      const blob = video ? f : await MEDIA.shrinkImage(f);
      const { ref, persisted } = await MEDIA.save(blob, video ? 'vid' : 'img');
      U.set(cfg(), p, ref);
      STATE.touch();
      STATE.checkpoint();
      render();
      SHOP.toast(persisted ? (video ? 'Vídeo trocado! ⚡' : 'Foto salva! ⚡') : 'Atenção: este navegador não salvou o arquivo. Baixe o site antes de fechar.', persisted ? 'check' : 'close');
    } catch (err) {
      console.error(err);
      SHOP.toast('Não foi possível usar esse arquivo.', 'close');
    }
  }

  async function importFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    try {
      await EXPORT.importFile(f);
      render();
      SHOP.toast('Site carregado! Continue editando ⚡', 'check');
    } catch (err) {
      console.error(err);
      SHOP.toast(err.message || 'Arquivo inválido', 'close');
    }
  }

  /* ---------- cliques ---------- */
  const move = (arr, i, d) => {
    const j = i + d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  };
  const commit = () => {
    STATE.touch();
    STATE.checkpoint();
    render();
  };

  function onClick(e) {
    const t = e.target.closest('[data-a],[data-tab],[data-go],[data-preset],[data-sw]');
    if (!t || !root.contains(t)) return;
    // fecha o grupo de edições digitadas antes, para o "Desfazer" voltar uma ação de cada vez
    if (!['undo', 'redo'].includes(t.dataset.a)) STATE.checkpoint();
    if (t.dataset.tab) return goTab(t.dataset.tab);
    if (t.dataset.go) return goTab(t.dataset.go);
    if (t.dataset.preset) {
      THEME.preset(cfg(), t.dataset.preset);
      SHOP.toast(`Tema "${THEME.PRESETS[t.dataset.preset].label}" aplicado`, 'palette');
      return commit();
    }
    if (t.dataset.sw) {
      U.set(cfg(), t.dataset.p, t.dataset.sw);
      cfg().theme.preset = 'custom';
      return commit();
    }
    const a = t.dataset.a;
    const c = cfg();
    const i = +t.dataset.i;
    switch (a) {
      case 'close':
        return close();
      case 'peek':
        return peek(true);
      case 'undo':
        STATE.undo();
        return render();
      case 'redo':
        STATE.redo();
        return render();
      case 'edit-mode':
        return editMode(true);
      case 'stale-restore':
        STATE.restoreStale();
        return render();
      case 'stale-dismiss':
        STATE.dismissStale();
        return render();
      /* seções */
      case 'sec-open':
        opened.secoes = opened.secoes === t.dataset.id ? null : t.dataset.id;
        return render();
      case 'sec-move':
        move(c.order, i, +t.dataset.d);
        return commit();
      /* listas genéricas */
      case 'obj-add': {
        const arr = g(t.dataset.p) || [];
        arr.push(JSON.parse(t.dataset.tpl));
        U.set(c, t.dataset.p, arr);
        return commit();
      }
      case 'obj-del': {
        const arr = g(t.dataset.p) || [];
        arr.splice(i, 1);
        return commit();
      }
      case 'media-clear':
        U.set(c, t.dataset.p, '');
        return commit();
      /* produtos */
      case 'prod-open':
        opened.produtos = opened.produtos === t.dataset.id ? null : t.dataset.id;
        return render();
      case 'prod-move':
        move(c.products, i, +t.dataset.d);
        return commit();
      case 'prod-add': {
        const id = 'p' + Date.now().toString(36);
        const cat = (c.categories[0] || {}).id || '';
        c.products.unshift({
          id,
          name: 'Novo produto',
          cat,
          price: 99.9,
          old: 0,
          desc: 'Descreva a peça: tecido, caimento, detalhes que fazem a diferença.',
          sizes: 'P, M, G, GG',
          art: { type: 'tee', color: '#1c1c1c', detail: c.theme.colors.accent, print: 'bolt' },
          img: '',
          isNew: true,
          best: false,
        });
        opened.produtos = id;
        search = '';
        body.scrollTop = 0;
        SHOP.toast('Produto criado — preencha os dados', 'plus');
        return commit();
      }
      case 'prod-dup': {
        const copy = U.clone(c.products[i]);
        copy.id = 'p' + Date.now().toString(36);
        copy.name += ' (cópia)';
        c.products.splice(i + 1, 0, copy);
        opened.produtos = copy.id;
        return commit();
      }
      case 'prod-del':
        if (!confirm(`Excluir "${c.products[i].name}"? (dá pra desfazer)`)) return;
        c.products.splice(i, 1);
        return commit();
      case 'prod-see': {
        const p = c.products[i];
        peek(true);
        setTimeout(() => SHOP.view(p.id), 250);
        return;
      }
      /* categorias */
      case 'cat-open':
        opened.categorias = opened.categorias === t.dataset.id ? null : t.dataset.id;
        return render();
      case 'cat-move':
        move(c.categories, i, +t.dataset.d);
        return commit();
      case 'cat-add': {
        let id = 'categoria';
        let n = 2;
        while (c.categories.some((k) => k.id === id)) id = 'categoria-' + n++;
        c.categories.push({ id, name: 'Nova categoria', art: { type: 'tag', color: '#1c1c1c', detail: c.theme.colors.accent }, img: '' });
        opened.categorias = id;
        return commit();
      }
      case 'cat-del': {
        const k = c.categories[i];
        const n = c.products.filter((p) => p.cat === k.id).length;
        if (!confirm(`Excluir a categoria "${k.name}"?${n ? ` ${n} produto(s) ficarão sem categoria.` : ''}`)) return;
        c.products.forEach((p) => {
          if (p.cat === k.id) p.cat = '';
        });
        c.categories.splice(i, 1);
        return commit();
      }
      /* vídeo */
      case 'video-default':
        c.bubble.video = 'media:default-video';
        return commit();
      case 'video-reset-pos':
        BUBBLE.resetPos();
        SHOP.toast('Bolinha de volta ao lugar inicial', 'move');
        return;
      case 'video-test':
        peek(true);
        setTimeout(() => BUBBLE.openPlayer(), 200);
        return;
      /* publicar */
      case 'export':
        return EXPORT.download(t);
      case 'share':
        return EXPORT.share(t);
      case 'pin-save': {
        const inp = root.querySelector('#lxa-newpin');
        const v = (inp && inp.value.trim().toLowerCase()) || '';
        if (v.length < 4) return SHOP.toast('O PIN precisa ter pelo menos 4 caracteres', 'close');
        c.admin.pin = U.hash(v);
        U.store.set(OWNER_KEY, c.admin.pin);
        SHOP.toast('PIN salvo! Baixe o site para valer no arquivo publicado.', 'lock');
        return commit();
      }
      case 'reset':
        if (!confirm('Descartar TODAS as alterações feitas neste aparelho e voltar para a versão do arquivo?')) return;
        STATE.reset();
        render();
        SHOP.toast('Alterações descartadas', 'refresh');
        return;
      case 'logout':
        U.store.del(OWNER_KEY);
        close();
        SHOP.toast('Você saiu do modo dono', 'lock');
        return;
      default:
    }
  }

  /* ====================================================================== */
  /* Abrir / fechar / espiar / modo edição                                   */
  /* ====================================================================== */
  const isOwner = () => U.store.get(OWNER_KEY) === cfg().admin.pin;

  function floatBtn(cls, html, onclick) {
    const d = document.createElement('div');
    d.className = 'lxa-float ' + cls;
    d.innerHTML = html;
    d.addEventListener('click', onclick);
    document.body.appendChild(d);
    return d;
  }
  function refreshFloats() {
    const owner = isOwner();
    if (owner && !fab)
      fab = floatBtn('lxa-fab', `<button type="button" aria-label="Abrir painel">${icon('gear')}Painel</button>`, () => show());
    if (fab) fab.hidden = !owner || isOpen || peeking || UI.editing;
    if (!peekBar)
      peekBar = floatBtn('lxa-peek', `<button type="button" class="y" data-pk="back">${icon('gear')}Voltar ao painel</button>`, () => {
        peek(false);
      });
    peekBar.hidden = !(isOpen && peeking && !UI.editing);
    if (!editBar)
      editBar = floatBtn('lxa-editbar', `<span>${icon('edit')} Toque num texto com borda tracejada e escreva.</span><button type="button">Concluir</button>`, (e) => {
        if (e.target.closest('button')) editMode(false);
      });
    editBar.hidden = !UI.editing;
  }

  function show() {
    if (!root) build();
    root.hidden = false;
    isOpen = true;
    peeking = false;
    document.body.classList.remove('lxa-peeking');
    render();
    requestAnimationFrame(() => root.classList.add('open'));
    refreshFloats();
  }
  function close() {
    if (UI.editing) editMode(false, true);
    isOpen = false;
    peeking = false;
    document.body.classList.remove('lxa-peeking');
    if (root) {
      root.classList.remove('open');
      setTimeout(() => {
        if (!isOpen) root.hidden = true;
      }, 360);
    }
    STATE.checkpoint();
    refreshFloats();
  }
  function peek(on) {
    peeking = on;
    document.body.classList.toggle('lxa-peeking', on);
    if (!on) render();
    refreshFloats();
  }

  function lock() {
    const wrap = document.createElement('div');
    wrap.className = 'lxa-lock';
    const isDefault = cfg().admin.pin === DEFAULT_PIN;
    wrap.innerHTML = `<form autocomplete="off"><div class="lxa-lock-ic">${icon('lock')}</div><h3>Painel da loja</h3><p>Digite o PIN para editar o site.${isDefault ? ' (PIN inicial: <b>luxx</b>)' : ''}</p>
      <input type="password" name="pin" aria-label="PIN" autocomplete="current-password" autofocus><div class="lxa-err" aria-live="polite"></div>
      <div class="lxa-lock-btns"><button type="button" data-x="1">Cancelar</button><button type="submit">Entrar</button></div></form>`;
    document.body.appendChild(wrap);
    const form = wrap.querySelector('form');
    const inp = form.pin;
    setTimeout(() => inp.focus(), 50);
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-x]')) wrap.remove();
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (U.hash(inp.value.trim().toLowerCase()) === cfg().admin.pin) {
        U.store.set(OWNER_KEY, cfg().admin.pin);
        wrap.remove();
        show();
      } else {
        wrap.querySelector('.lxa-err').textContent = 'PIN incorreto';
        form.classList.remove('shake');
        void form.offsetWidth;
        form.classList.add('shake');
        inp.select();
      }
    });
  }

  function open() {
    if (isOwner()) show();
    else lock();
  }

  /* ---------- edição direto no site ---------- */
  function enableInline() {
    U.$$('#luxx-root [data-edit]').forEach((el) => {
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'true');
    });
  }
  function editMode(on, silent) {
    UI.editing = on;
    document.body.classList.toggle('lx-editing', on);
    if (on) {
      SHOP.closeModal();
      SHOP.closeCart();
      peek(true);
    }
    R.mount();
    if (on) enableInline();
    else if (!silent) {
      STATE.checkpoint();
      peek(false);
    }
    refreshFloats();
  }
  function inlineInput(e) {
    const el = e.target.closest && e.target.closest('#luxx-root [data-edit][contenteditable]');
    if (!el) return;
    const v = el.dataset.ml ? el.innerText.replace(/ /g, ' ').replace(/\n{3,}/g, '\n\n') : el.textContent.replace(/ /g, ' ').replace(/\s*\n\s*/g, ' ');
    U.set(cfg(), el.dataset.edit, v);
    STATE.touch('inline');
  }

  function checkHash() {
    if (/^#(admin|painel)$/i.test(location.hash)) {
      try {
        history.replaceState(null, '', location.pathname + location.search);
      } catch (e) {}
      open();
    }
  }

  function init() {
    STATE.on((why) => {
      if (why === 'undo' || why === 'redo' || why === 'replace') {
        if (isOpen) render();
      }
      status();
    });
    document.addEventListener('input', inlineInput);
    document.addEventListener('keydown', (e) => {
      const el = e.target.closest && e.target.closest('#luxx-root [data-edit][contenteditable]');
      if (el && e.key === 'Enter' && !el.dataset.ml) {
        e.preventDefault();
        el.blur();
      }
      if (e.key === 'Escape' && isOpen && !peeking && !document.querySelector('.lxa-lock')) close();
    });
    document.addEventListener('paste', (e) => {
      const el = e.target.closest && e.target.closest('#luxx-root [data-edit][contenteditable]');
      if (!el) return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, el.dataset.ml ? text : text.replace(/\s*\n\s*/g, ' '));
    });
    window.addEventListener('hashchange', checkHash);
    checkHash();
    refreshFloats();
  }

  return { init, open, show, close, enableInline, get isOpen() { return isOpen; } };
})();

/* ---- 10-export.js ---- */
/* ==========================================================================
   LUXX STORE — gerar o site atualizado (um único arquivo .html) e restaurar
   ========================================================================== */
const EXPORT = (() => {
  const FILE = 'LUXX STORE SITE.html';

  /* troca referências de mídia em qualquer lugar da configuração */
  function swapRefs(obj, map) {
    if (Array.isArray(obj)) obj.forEach((v, i) => (typeof v === 'string' && v in map ? (obj[i] = map[v]) : swapRefs(v, map)));
    else if (obj && typeof obj === 'object')
      Object.keys(obj).forEach((k) => (typeof obj[k] === 'string' && obj[k] in map ? (obj[k] = map[obj[k]]) : swapRefs(obj[k], map)));
  }
  const safeJSON = (o) => JSON.stringify(o).replace(/</g, '\\u003c');

  async function build() {
    const out = U.clone(STATE.cfg);
    const blocks = {};
    const map = {};
    let n = 0;
    for (const r of MEDIA.refs(out)) {
      const k = MEDIA.kind(r);
      if (k === 'embed') {
        const id = r.slice(6);
        const t = MEDIA.embedText(id);
        if (t) blocks[id] = t;
        else map[r] = '';
      } else if (k === 'idb') {
        const du = await MEDIA.toDataUrl(r);
        if (du) {
          const id = 'm' + ++n + '-' + Date.now().toString(36);
          blocks[id] = du;
          map[r] = 'media:' + id;
        } else map[r] = '';
      }
    }
    swapRefs(out, map);

    const doc = new DOMParser().parseFromString(PRISTINE, 'text/html');
    const head = doc.head;
    const byId = (id, tag, where = head) => {
      let el = doc.getElementById(id);
      if (!el) {
        el = doc.createElement(tag);
        el.id = id;
        where.appendChild(el);
      }
      return el;
    };
    U.$$('script[id^="luxx-media-"]', doc).forEach((s) => s.remove());
    const app = doc.getElementById('luxx-app');
    Object.entries(blocks).forEach(([id, data]) => {
      const s = doc.createElement('script');
      s.type = 'text/plain';
      s.id = 'luxx-media-' + id;
      s.textContent = data;
      app.parentNode.insertBefore(s, app);
    });
    const json = safeJSON(out);
    doc.getElementById('luxx-data').textContent = json;
    STATE.noteExport(json);
    byId('luxx-vars', 'style').textContent = THEME.vars(out);
    byId('luxx-custom', 'style').textContent = String(out.theme.css || '').replace(/<\/style/gi, '<\\/style');
    const fonts = byId('luxx-fonts', 'link');
    fonts.setAttribute('rel', 'stylesheet');
    const fu = THEME.fontsUrl(out);
    if (fu) fonts.setAttribute('href', fu);
    else fonts.removeAttribute('href');
    const t = doc.querySelector('title') || head.appendChild(doc.createElement('title'));
    t.textContent = out.seo.title || out.brand.name;
    const meta = (attr, name, content) => {
      let m = head.querySelector(`meta[${attr}="${name}"]`);
      if (!m) {
        m = doc.createElement('meta');
        m.setAttribute(attr, name);
        head.appendChild(m);
      }
      m.setAttribute('content', content);
    };
    meta('name', 'description', out.seo.description || '');
    meta('name', 'theme-color', out.theme.colors.headerBg);
    meta('property', 'og:title', out.seo.title || out.brand.name);
    meta('property', 'og:description', out.seo.description || '');
    byId('luxx-icon', 'link').setAttribute('rel', 'icon');
    doc.getElementById('luxx-icon').setAttribute('href', THEME.faviconHref(out));
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  async function withBusy(btn, fn) {
    const old = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = icon('clock') + 'Gerando…';
    }
    try {
      return await fn();
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = old;
      }
    }
  }

  async function sizeCheck() {
    let total = 0;
    for (const r of MEDIA.refs(STATE.cfg)) total += await MEDIA.size(r);
    if (total > 25 * 1048576) return confirm(`Fotos e vídeos somam ${U.fileSize(total)}. O arquivo vai ficar pesado para abrir no celular. Continuar?`);
    return true;
  }

  async function download(btn) {
    STATE.checkpoint();
    if (!(await sizeCheck())) return;
    await withBusy(btn, async () => {
      try {
        const html = await build();
        const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = FILE;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        SHOP.toast(`"${FILE}" baixado (${U.fileSize(html.length)}) ⚡`, 'download');
      } catch (e) {
        console.error(e);
        SHOP.toast('Não foi possível gerar o arquivo', 'close');
      }
    });
  }

  async function share(btn) {
    STATE.checkpoint();
    if (!(await sizeCheck())) return;
    await withBusy(btn, async () => {
      try {
        const html = await build();
        const file = new File([html], FILE, { type: 'text/html' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: STATE.cfg.brand.name });
        else throw new Error('share');
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        SHOP.toast('Compartilhamento indisponível aqui — use "Baixar site atualizado"', 'close');
      }
    });
  }

  async function importFile(file) {
    const text = await file.text();
    let next;
    const media = {};
    if (/^\s*\{/.test(text)) next = JSON.parse(text);
    else {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const d = doc.getElementById('luxx-data');
      if (!d) throw new Error('Esse arquivo não é um site LUXX');
      next = JSON.parse(d.textContent);
      U.$$('script[id^="luxx-media-"]', doc).forEach((s) => (media[s.id.slice(11)] = s.textContent.trim()));
    }
    if (!next || !next.theme || !Array.isArray(next.products)) throw new Error('Arquivo sem configuração válida');
    const map = {};
    for (const r of MEDIA.refs(next)) {
      if (MEDIA.kind(r) !== 'embed') continue;
      const id = r.slice(6);
      const mine = MEDIA.embedText(id);
      const theirs = media[id];
      if (mine && (!theirs || theirs === mine)) continue; // mesma mídia já existe neste arquivo
      const du = theirs || '';
      if (!du) {
        map[r] = '';
        continue;
      }
      const { ref } = await MEDIA.save(MEDIA.dataUrlToBlob(du), 'imp');
      map[r] = ref;
    }
    swapRefs(next, map);
    await MEDIA.preload(next);
    STATE.replace(next);
  }

  return { build, download, share, importFile };
})();

/* ---- 99-main.js ---- */
/* ==========================================================================
   LUXX STORE — inicialização
   ========================================================================== */
async function boot() {
  const root = document.getElementById('luxx-root');
  try {
    STATE.load();
    THEME.apply(C());
    await MEDIA.preload(C());
    R.mount();
    SHOP.init();
    BUBBLE.init();
    ADMIN.init();
    // limpeza de arquivos antigos só no aparelho do dono (visitantes nunca enviam mídia)
    if (U.store.get('luxx_owner_v1')) MEDIA.gc([C(), STATE.stale && STATE.stale.cfg]);
  } catch (err) {
    console.error('LUXX:', err);
    if (root && !root.children.length)
      root.innerHTML = '<p class="lx-noscript">Ops! Não foi possível carregar o site. Tente abrir no Chrome ou Safari.</p>';
    return;
  }

  const rerender = U.debounce(async () => {
    await MEDIA.preload(C());
    R.mount();
    BUBBLE.update();
  }, 140);

  STATE.on((why) => {
    if (why === 'history') return;
    THEME.apply(C());
    if (why === 'inline') return;
    rerender();
  });
}

boot();

})();
